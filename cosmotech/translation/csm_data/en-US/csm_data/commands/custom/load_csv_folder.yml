description: |
  Stream every CSV file of a folder into its own existing PostgreSQL table with COPY FROM STDIN

  Each .csv file directly in the folder (not recursive) is loaded into the table named table prefix + file name
  without extension, lowercased. PostgreSQL parses the CSV and converts the values to the column types declared on
  the table: the tables must already exist and each CSV header must only contain column names of its table
  (exact match, case-sensitive).

  All files and tables are checked before the first load. Then files are loaded one after the other, one
  transaction each: if a load fails, the tables already loaded stay committed.

  Connection settings: either give all of --postgres-host, --postgres-db, --postgres-schema and --postgres-user
  (with the password), or give none of them to use the CoAL configuration file (CONFIG_FILE_PATH,
  or /mnt/coal/coal-config.toml in the cluster), then the POSTGRES_* environment variables.

  With --add-id, the transaction-local setting csm.run_id is set from --run-id, so that a table column
  `csm_run_id text NOT NULL DEFAULT current_setting('csm.run_id')` is filled for every row.

  The postgresql user must have USAGE granted on the schema and INSERT on the tables.
parameters:
  csv_folder: Folder containing the CSV files to load, one table per .csv file
  table_prefix: Prefix added to the file names to get the table names, lowercased (default Cosmotech_)
